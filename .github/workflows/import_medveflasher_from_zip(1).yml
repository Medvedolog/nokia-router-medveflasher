# .github/workflows/import_medveflasher_from_zip.yml
#
# Imports Nokia Router MedveFlasher from _incoming/.
#
# Supports BOTH:
#   _incoming/Nokia-Router-MedveFlasher-<version>.zip
#
# and GitHub-web-friendly split upload:
#   _incoming/Nokia-Router-MedveFlasher-<version>.zip.part-001
#   _incoming/Nokia-Router-MedveFlasher-<version>.zip.part-002
#   ...
#   _incoming/Nokia-Router-MedveFlasher-<version>.zip.sha256   (recommended)
#
# The input zip_path is always the LOGICAL .zip path, even when only parts exist.
# After a successful import, the consumed _incoming file(s) are removed and that
# cleanup is included in the workflow commit.

name: import-medveflasher-from-zip

on:
  workflow_dispatch:
    inputs:
      zip_path:
        description: "Logical ZIP path under _incoming/; split parts may be used instead of the full ZIP"
        required: true
        default: "_incoming/Nokia-Router-MedveFlasher-1.0.0-rc7.zip"
      commit_message:
        description: "Commit message"
        required: true
        default: "Import Nokia Router MedveFlasher 1.0.0-rc7 from ZIP"

permissions:
  contents: write

concurrency:
  group: medveflasher-zip-import-${{ github.ref }}
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    env:
      ZIP_INPUT: ${{ inputs.zip_path }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare ZIP or split ZIP parts
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$ZIP_INPUT"

          case "$ZIP" in
            _incoming/*.zip) ;;
            *)
              echo "ERROR: zip_path must be a logical .zip path directly under _incoming/"
              echo "Example: _incoming/Nokia-Router-MedveFlasher-1.0.0-rc7.zip"
              exit 1
              ;;
          esac

          REPO_ROOT="$(pwd -P)"
          mkdir -p _workzip
          : > _workzip/consumed-incoming.txt

          # Validate the logical path itself cannot escape the repository.
          ZIP_PARENT_REAL="$(realpath -m "$(dirname "$ZIP")")"
          if [ "$ZIP_PARENT_REAL" != "$REPO_ROOT/_incoming" ]; then
            echo "ERROR: ZIP must resolve directly under _incoming/"
            echo "Resolved parent: $ZIP_PARENT_REAL"
            exit 1
          fi

          mapfile -t PARTS < <(
            find _incoming -maxdepth 1 -type f \
              -name "$(basename "$ZIP").part-*" \
              -printf '%p\n' | sort
          )

          if [ -f "$ZIP" ] && [ "${#PARTS[@]}" -gt 0 ]; then
            echo "ERROR: both full ZIP and split ZIP parts are present."
            echo "Remove one representation to avoid ambiguity."
            exit 1
          fi

          EFFECTIVE="_workzip/input.zip"

          if [ -f "$ZIP" ]; then
            echo "Using full ZIP: $ZIP"
            cp -- "$ZIP" "$EFFECTIVE"
            printf '%s\n' "$ZIP" >> _workzip/consumed-incoming.txt
          else
            if [ "${#PARTS[@]}" -eq 0 ]; then
              echo "ERROR: neither '$ZIP' nor split parts '${ZIP}.part-NNN' were found."
              echo "Available files in _incoming/:"
              find _incoming -maxdepth 1 -type f -printf '  %p\n' | sort || true
              exit 1
            fi

            echo "Using split ZIP parts:"
            printf '  %s\n' "${PARTS[@]}"

            python3 - "$ZIP" "${PARTS[@]}" <<'PY'
          import pathlib
          import re
          import sys

          logical = pathlib.Path(sys.argv[1])
          parts = [pathlib.Path(p) for p in sys.argv[2:]]
          pat = re.compile(re.escape(logical.name) + r"\.part-(\d{3})$")

          nums = []
          for p in parts:
              m = pat.fullmatch(p.name)
              if not m:
                  raise SystemExit(f"ERROR: invalid split-part name: {p}")
              nums.append(int(m.group(1)))

          expected = list(range(1, len(nums) + 1))
          if nums != expected:
              raise SystemExit(
                  f"ERROR: split parts must be contiguous part-001..part-{len(nums):03d}; got {nums}"
              )

          for p in parts:
              if p.stat().st_size == 0:
                  raise SystemExit(f"ERROR: empty split part: {p}")
          PY

            cat "${PARTS[@]}" > "$EFFECTIVE"
            printf '%s\n' "${PARTS[@]}" >> _workzip/consumed-incoming.txt
            echo "Assembled: $EFFECTIVE ($(stat -c '%s' "$EFFECTIVE") bytes)"
          fi

          SIDE="${ZIP}.sha256"
          if [ -f "$SIDE" ]; then
            EXPECTED_SHA="$(awk 'NF {print $1; exit}' "$SIDE" | tr '[:upper:]' '[:lower:]')"
            ACTUAL_SHA="$(sha256sum "$EFFECTIVE" | awk '{print $1}')"

            if ! [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{64}$ ]]; then
              echo "ERROR: invalid SHA256 in '$SIDE'"
              exit 1
            fi

            echo "Expected ZIP SHA256: $EXPECTED_SHA"
            echo "Actual ZIP SHA256:   $ACTUAL_SHA"

            if [ "$EXPECTED_SHA" != "$ACTUAL_SHA" ]; then
              echo "ERROR: assembled/full ZIP SHA256 mismatch"
              exit 1
            fi

            printf '%s\n' "$SIDE" >> _workzip/consumed-incoming.txt
          else
            echo "WARNING: ${ZIP}.sha256 is absent; relying on ZIP integrity + internal data/SHA256SUMS."
          fi

          echo "EFFECTIVE_ZIP=$EFFECTIVE" >> "$GITHUB_ENV"

      - name: Reject unsafe ZIP paths
        shell: bash
        run: |
          set -euo pipefail

          python3 - "$EFFECTIVE_ZIP" <<'PY'
          import sys
          import zipfile
          from pathlib import PurePosixPath

          path = sys.argv[1]
          bad = []

          try:
              zf = zipfile.ZipFile(path)
          except zipfile.BadZipFile as exc:
              raise SystemExit(f"ERROR: invalid/corrupt ZIP: {exc}")

          with zf:
              for info in zf.infolist():
                  name = info.filename.replace("\\", "/")
                  p = PurePosixPath(name)
                  if p.is_absolute() or ".." in p.parts:
                      bad.append(name)

          if bad:
              print("ERROR: unsafe path(s) inside ZIP:")
              for name in bad:
                  print(f"  {name}")
              raise SystemExit(1)
          PY

      - name: Unpack ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _workzip/unpacked
          mkdir -p _workzip/unpacked
          unzip -q "$EFFECTIVE_ZIP" -d _workzip/unpacked
          echo "=== ZIP contents ==="
          find _workzip/unpacked -type f | sort

      - name: Detect release root
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t TOP < <(find _workzip/unpacked -mindepth 1 -maxdepth 1 -print | sort)
          if [ "${#TOP[@]}" -ne 1 ] || [ ! -d "${TOP[0]}" ]; then
            echo "ERROR: release ZIP must contain exactly one top-level directory"
            printf 'Top-level entries:\n'
            printf '  %s\n' "${TOP[@]:-<none>}"
            exit 1
          fi

          SRC="${TOP[0]}"
          echo "src=$SRC" >> "$GITHUB_OUTPUT"
          echo "release_dir=$(basename "$SRC")" >> "$GITHUB_OUTPUT"
          echo "Using release root: $SRC"

      - name: Validate release layout
        env:
          SRC: ${{ steps.detect.outputs.src }}
        shell: bash
        run: |
          set -euo pipefail
          required=(
            START.cmd
            START.sh
            RESTORE_STOCK.cmd
            RESTORE_STOCK.sh
            data/VERSION
            data/MANIFEST.json
            data/SHA256SUMS
            data/master.py
            data/stock_web.py
            data/transition-bundle.bin
            data/transition-manual-bundle.bin
            docs/README_RU.md
            docs/README_EN.md
            docs/IMAGE_STATUS_RU.md
            docs/IMAGE_STATUS_EN.md
            docs/CHANGELOG_RU.md
            docs/CHANGELOG.md
          )

          fail=0
          for rel in "${required[@]}"; do
            if [ ! -f "$SRC/$rel" ]; then
              echo "MISSING: $rel"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] || exit 1

          if find "$SRC" -type l -print -quit | grep -q .; then
            echo "ERROR: symlinks are not allowed in a release ZIP"
            find "$SRC" -type l -print
            exit 1
          fi

          if find "$SRC" \
              \( -type d -name work -o -type d -name __pycache__ \
                 -o -type f -name '*.pyc' -o -type f -name '*.pyo' \) \
              -print -quit | grep -q .; then
            echo "ERROR: release contains forbidden work/cache/bytecode files"
            find "$SRC" \
              \( -type d -name work -o -type d -name __pycache__ \
                 -o -type f -name '*.pyc' -o -type f -name '*.pyo' \) \
              -print
            exit 1
          fi

          echo "Release layout OK."

      - name: Verify SHA256SUMS and coverage
        env:
          SRC: ${{ steps.detect.outputs.src }}
        shell: bash
        run: |
          set -euo pipefail

          (
            cd "$SRC"
            sha256sum -c data/SHA256SUMS
          )

          python3 - "$SRC" <<'PY'
          import pathlib
          import sys

          root = pathlib.Path(sys.argv[1])
          sums = root / "data" / "SHA256SUMS"

          listed = set()
          for raw in sums.read_text(encoding="utf-8").splitlines():
              if not raw.strip():
                  continue
              try:
                  _digest, rel = raw.split("  ", 1)
              except ValueError:
                  raise SystemExit(f"ERROR: malformed SHA256SUMS line: {raw!r}")
              listed.add(rel.removeprefix("./"))

          actual = {
              p.relative_to(root).as_posix()
              for p in root.rglob("*")
              if p.is_file() and p != sums
          }

          missing = sorted(actual - listed)
          extra = sorted(listed - actual)
          if missing or extra:
              if missing:
                  print("ERROR: files missing from SHA256SUMS:")
                  for rel in missing:
                      print(f"  {rel}")
              if extra:
                  print("ERROR: SHA256SUMS references absent files:")
                  for rel in extra:
                      print(f"  {rel}")
              raise SystemExit(1)

          print(f"SHA256SUMS coverage OK: {len(actual)} files.")
          PY

      - name: Validate version consistency
        id: version
        env:
          SRC: ${{ steps.detect.outputs.src }}
          RELEASE_DIR: ${{ steps.detect.outputs.release_dir }}
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(tr -d '[:space:]' < "$SRC/data/VERSION")"

          APP_VERSION="$(python3 - "$SRC/data/master.py" <<'PY'
          import ast
          import pathlib
          import sys

          tree = ast.parse(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          for node in tree.body:
              if isinstance(node, ast.Assign):
                  for target in node.targets:
                      if isinstance(target, ast.Name) and target.id == "APP_VERSION":
                          print(ast.literal_eval(node.value))
                          raise SystemExit(0)
          raise SystemExit("APP_VERSION not found")
          PY
          )"

          MANIFEST_VERSION="$(python3 - "$SRC/data/MANIFEST.json" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as fh:
              print(json.load(fh)["version"])
          PY
          )"

          echo "data/VERSION:     $VERSION"
          echo "APP_VERSION:      $APP_VERSION"
          echo "MANIFEST version: $MANIFEST_VERSION"

          if [ "$VERSION" != "$APP_VERSION" ] || [ "$VERSION" != "$MANIFEST_VERSION" ]; then
            echo "ERROR: release version mismatch"
            exit 1
          fi

          EXPECTED_DIR="Nokia-Router-MedveFlasher-$VERSION"
          if [ "$RELEASE_DIR" != "$EXPECTED_DIR" ]; then
            echo "ERROR: top-level directory mismatch"
            echo "Expected: $EXPECTED_DIR"
            echo "Actual:   $RELEASE_DIR"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version consistency OK: $VERSION"

      - name: Validate scripts and metadata
        env:
          SRC: ${{ steps.detect.outputs.src }}
        shell: bash
        run: |
          set -euo pipefail

          python3 -m py_compile \
            "$SRC/data/master.py" \
            "$SRC/data/stock_web.py" \
            "$SRC/data/env_patcher.py" \
            "$SRC/data/recovery/manual-transition-source/build_manual_transition.py"

          python3 "$SRC/data/stock_web.py" --selftest

          bash -n "$SRC/START.sh"
          bash -n "$SRC/RESTORE_STOCK.sh"
          bash -n "$SRC/data/backup-agent.sh"
          bash -n "$SRC/data/nokia-stock-tftp-backup-safe.sh"
          bash -n "$SRC/data/stock-launcher.sh.in"

          python3 -m json.tool "$SRC/data/MANIFEST.json" >/dev/null

          find "$SRC" -type d -name __pycache__ -prune -exec rm -rf {} +
          find "$SRC" -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete

          echo "Static validation passed."

      - name: Import release into repository
        env:
          SRC: ${{ steps.detect.outputs.src }}
        shell: bash
        run: |
          set -euo pipefail

          cp -a "$SRC/START.cmd" START.cmd
          cp -a "$SRC/START.sh" START.sh
          cp -a "$SRC/RESTORE_STOCK.cmd" RESTORE_STOCK.cmd
          cp -a "$SRC/RESTORE_STOCK.sh" RESTORE_STOCK.sh

          mkdir -p data docs
          rsync -a --delete "$SRC/data/" data/
          rsync -a --delete "$SRC/docs/" docs/

      - name: Normalize permissions
        shell: bash
        run: |
          set -euo pipefail

          chmod 0644 START.cmd RESTORE_STOCK.cmd
          chmod 0755 START.sh RESTORE_STOCK.sh

          find data docs -type f -exec chmod 0644 {} +
          find data docs -type d -exec chmod 0755 {} +
          chmod 0755 data/backup-agent.sh data/nokia-stock-tftp-backup-safe.sh

      - name: Remove consumed incoming upload
        shell: bash
        run: |
          set -euo pipefail

          echo "Removing successfully consumed staging file(s):"
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            echo "  $path"
            rm -f -- "$path"
          done < _workzip/consumed-incoming.txt

      - name: Post-import verification
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Imported release ==="
          echo "Version: $(cat data/VERSION)"
          echo "Files:   $(find data docs -type f | wc -l) in data/ + docs/"
          echo ""

          echo "=== Verify imported SHA256SUMS ==="
          sha256sum -c data/SHA256SUMS

          echo ""
          echo "=== Repository status ==="
          git status --short
          echo ""
          git diff --stat

      - name: Commit and push
        env:
          COMMIT_MESSAGE: ${{ inputs.commit_message }}
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -- \
            START.cmd START.sh RESTORE_STOCK.cmd RESTORE_STOCK.sh \
            data docs

          # Stage only the consumed _incoming paths, not unrelated files.
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            git add -A -- "$path"
          done < _workzip/consumed-incoming.txt

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          echo "=== Staged diff ==="
          git diff --cached --stat

          git commit -m "$COMMIT_MESSAGE"
          git push origin "HEAD:${GITHUB_REF_NAME}"
