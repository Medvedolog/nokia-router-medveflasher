# .github/workflows/import_medveflasher_from_zip.yml
# Imports a Nokia Router MedveFlasher release ZIP from _incoming/ into the repository.
# Run manually: Actions -> import-medveflasher-from-zip -> Run workflow
#
# Expected ZIP layout:
#   Nokia-Router-MedveFlasher-<version>/
#     START.cmd
#     START.sh
#     RESTORE_STOCK.cmd
#     RESTORE_STOCK.sh
#     data/
#     docs/
#
# The ZIP is authoritative for data/ and docs/: stale files in those two directories
# are removed during import. Repository infrastructure (.github/, _incoming/, README,
# LICENSE, etc.) is not touched.

name: import-medveflasher-from-zip

on:
  workflow_dispatch:
    inputs:
      zip_path:
        description: "Path to release ZIP inside _incoming/"
        required: true
        default: "_incoming/Nokia-Router-MedveFlasher-1.0.0-rc7.zip"
      commit_message:
        description: "Commit message"
        required: true
        default: "Import Nokia Router MedveFlasher 1.0.0-rc7 from ZIP"

permissions:
  contents: write

concurrency:
  group: medveflasher-zip-import-${{ github.ref }}
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    env:
      ZIP_INPUT: ${{ inputs.zip_path }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate ZIP path
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$ZIP_INPUT"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: ZIP not found at '$ZIP'"
            echo "Available files in _incoming/:"
            find _incoming -maxdepth 2 -type f -printf '  %p\n' 2>/dev/null | sort || true
            exit 1
          fi

          case "$ZIP" in
            *.zip) ;;
            *)
              echo "ERROR: input must point to a .zip file"
              exit 1
              ;;
          esac

          REPO_ROOT="$(pwd -P)"
          ZIP_REAL="$(realpath "$ZIP")"
          case "$ZIP_REAL" in
            "$REPO_ROOT/_incoming/"*) ;;
            *)
              echo "ERROR: ZIP must be located under _incoming/"
              echo "Resolved path: $ZIP_REAL"
              exit 1
              ;;
          esac

          echo "Using ZIP: $ZIP"

      - name: Reject unsafe ZIP paths
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$ZIP_INPUT"

          python3 - "$ZIP" <<'PY'
          import sys
          import zipfile
          from pathlib import PurePosixPath

          path = sys.argv[1]
          bad = []
          with zipfile.ZipFile(path) as zf:
              for info in zf.infolist():
                  name = info.filename.replace('\\', '/')
                  p = PurePosixPath(name)
                  if p.is_absolute() or '..' in p.parts:
                      bad.append(name)

          if bad:
              print('ERROR: unsafe path(s) inside ZIP:')
              for name in bad:
                  print(f'  {name}')
              raise SystemExit(1)
          PY

      - name: Unpack ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _workzip
          mkdir -p _workzip
          unzip -q "$ZIP_INPUT" -d _workzip
          echo "=== ZIP contents ==="
          find _workzip -type f | sort

      - name: Detect release root
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t TOP < <(find _workzip -mindepth 1 -maxdepth 1 -print | sort)
          if [ "${#TOP[@]}" -ne 1 ] || [ ! -d "${TOP[0]}" ]; then
            echo "ERROR: release ZIP must contain exactly one top-level directory"
            printf 'Top-level entries:\n'
            printf '  %s\n' "${TOP[@]:-<none>}"
            exit 1
          fi

          SRC="${TOP[0]}"
          echo "src=$SRC" >> "$GITHUB_OUTPUT"
          echo "release_dir=$(basename "$SRC")" >> "$GITHUB_OUTPUT"
          echo "Using release root: $SRC"

      - name: Validate release layout
        env:
          SRC: ${{ steps.detect.outputs.src }}
        shell: bash
        run: |
          set -euo pipefail
          required=(
            START.cmd
            START.sh
            RESTORE_STOCK.cmd
            RESTORE_STOCK.sh
            data/VERSION
            data/MANIFEST.json
            data/SHA256SUMS
            data/master.py
            data/stock_web.py
            data/transition-bundle.bin
            data/transition-manual-bundle.bin
            docs/README_RU.md
            docs/README_EN.md
            docs/IMAGE_STATUS_RU.md
            docs/IMAGE_STATUS_EN.md
            docs/CHANGELOG_RU.md
            docs/CHANGELOG.md
          )

          fail=0
          for rel in "${required[@]}"; do
            if [ ! -f "$SRC/$rel" ]; then
              echo "MISSING: $rel"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] || exit 1

          if find "$SRC" -type l -print -quit | grep -q .; then
            echo "ERROR: symlinks are not allowed in a release ZIP"
            find "$SRC" -type l -print
            exit 1
          fi

          if find "$SRC" \
              \( -type d -name work -o -type d -name __pycache__ \
                 -o -type f -name '*.pyc' -o -type f -name '*.pyo' \) \
              -print -quit | grep -q .; then
            echo "ERROR: release contains forbidden work/cache/bytecode files"
            find "$SRC" \
              \( -type d -name work -o -type d -name __pycache__ \
                 -o -type f -name '*.pyc' -o -type f -name '*.pyo' \) \
              -print
            exit 1
          fi

          echo "Release layout OK."

      - name: Verify SHA256SUMS and coverage
        env:
          SRC: ${{ steps.detect.outputs.src }}
        shell: bash
        run: |
          set -euo pipefail
          echo "=== sha256sum -c ==="
          (
            cd "$SRC"
            sha256sum -c data/SHA256SUMS
          )

          python3 - "$SRC" <<'PY'
          import pathlib
          import sys

          root = pathlib.Path(sys.argv[1])
          sums = root / 'data' / 'SHA256SUMS'

          listed = set()
          for raw in sums.read_text(encoding='utf-8').splitlines():
              if not raw.strip():
                  continue
              try:
                  _digest, rel = raw.split('  ', 1)
              except ValueError:
                  print(f'ERROR: malformed SHA256SUMS line: {raw!r}')
                  raise SystemExit(1)
              rel = rel.removeprefix('./')
              listed.add(rel)

          actual = {
              p.relative_to(root).as_posix()
              for p in root.rglob('*')
              if p.is_file() and p != sums
          }

          missing = sorted(actual - listed)
          extra = sorted(listed - actual)
          if missing or extra:
              if missing:
                  print('ERROR: files missing from SHA256SUMS:')
                  for rel in missing:
                      print(f'  {rel}')
              if extra:
                  print('ERROR: SHA256SUMS references absent files:')
                  for rel in extra:
                      print(f'  {rel}')
              raise SystemExit(1)

          print(f'SHA256SUMS coverage OK: {len(actual)} files.')
          PY

      - name: Validate version consistency
        id: version
        env:
          SRC: ${{ steps.detect.outputs.src }}
          RELEASE_DIR: ${{ steps.detect.outputs.release_dir }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < "$SRC/data/VERSION")"
          APP_VERSION="$(python3 - "$SRC/data/master.py" <<'PY'
          import ast
          import pathlib
          import sys

          tree = ast.parse(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
          for node in tree.body:
              if isinstance(node, ast.Assign):
                  for target in node.targets:
                      if isinstance(target, ast.Name) and target.id == 'APP_VERSION':
                          print(ast.literal_eval(node.value))
                          raise SystemExit(0)
          raise SystemExit('APP_VERSION not found')
          PY
          )"
          MANIFEST_VERSION="$(python3 - "$SRC/data/MANIFEST.json" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding='utf-8') as fh:
              print(json.load(fh)['version'])
          PY
          )"

          echo "data/VERSION:     $VERSION"
          echo "APP_VERSION:      $APP_VERSION"
          echo "MANIFEST version: $MANIFEST_VERSION"

          if [ "$VERSION" != "$APP_VERSION" ] || [ "$VERSION" != "$MANIFEST_VERSION" ]; then
            echo "ERROR: release version mismatch"
            exit 1
          fi

          EXPECTED_DIR="Nokia-Router-MedveFlasher-$VERSION"
          ACTUAL_DIR="$RELEASE_DIR"
          if [ "$ACTUAL_DIR" != "$EXPECTED_DIR" ]; then
            echo "ERROR: top-level directory mismatch"
            echo "Expected: $EXPECTED_DIR"
            echo "Actual:   $ACTUAL_DIR"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version consistency OK: $VERSION"

      - name: Validate scripts and metadata
        env:
          SRC: ${{ steps.detect.outputs.src }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            "$SRC/data/master.py" \
            "$SRC/data/stock_web.py" \
            "$SRC/data/env_patcher.py" \
            "$SRC/data/recovery/manual-transition-source/build_manual_transition.py"

          python3 "$SRC/data/stock_web.py" --selftest

          bash -n "$SRC/START.sh"
          bash -n "$SRC/RESTORE_STOCK.sh"
          bash -n "$SRC/data/backup-agent.sh"
          bash -n "$SRC/data/nokia-stock-tftp-backup-safe.sh"
          bash -n "$SRC/data/stock-launcher.sh.in"

          python3 -m json.tool "$SRC/data/MANIFEST.json" >/dev/null

          # py_compile creates __pycache__; remove validation artifacts before import.
          find "$SRC" -type d -name __pycache__ -prune -exec rm -rf {} +
          find "$SRC" -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete

          echo "Static validation passed."

      - name: Import release into repository
        env:
          SRC: ${{ steps.detect.outputs.src }}
        shell: bash
        run: |
          set -euo pipefail
          # Top-level release launchers are managed explicitly.
          cp -a "$SRC/START.cmd" START.cmd
          cp -a "$SRC/START.sh" START.sh
          cp -a "$SRC/RESTORE_STOCK.cmd" RESTORE_STOCK.cmd
          cp -a "$SRC/RESTORE_STOCK.sh" RESTORE_STOCK.sh

          # data/ and docs/ are release-managed trees. --delete removes stale files
          # from older ZIPs but does not touch anything outside these directories.
          mkdir -p data docs
          rsync -a --delete "$SRC/data/" data/
          rsync -a --delete "$SRC/docs/" docs/

          # Deliberately untouched: .git/, .github/, _incoming/, README.md,
          # LICENSE*, .gitignore and any other repository-only files.

      - name: Normalize permissions
        shell: bash
        run: |
          set -euo pipefail

          chmod 0644 START.cmd RESTORE_STOCK.cmd
          chmod 0755 START.sh RESTORE_STOCK.sh

          # Release contents are data by default; only known shell entry points are executable.
          find data docs -type f -exec chmod 0644 {} +
          find data docs -type d -exec chmod 0755 {} +
          chmod 0755 data/backup-agent.sh data/nokia-stock-tftp-backup-safe.sh

      - name: Post-import verification
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Imported release ==="
          echo "Version: $(cat data/VERSION)"
          echo "Files:   $(find data docs -type f | wc -l) in data/ + docs/"
          echo ""

          echo "=== Verify imported SHA256SUMS ==="
          sha256sum -c data/SHA256SUMS

          echo ""
          echo "=== Repository status ==="
          git status --short
          echo ""
          git diff --stat

      - name: Commit and push
        env:
          COMMIT_MESSAGE: ${{ inputs.commit_message }}
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # -A is required so rsync --delete removals from data/ and docs/ are staged too.
          git add -A -- \
            START.cmd START.sh RESTORE_STOCK.cmd RESTORE_STOCK.sh \
            data docs

          if git diff --cached --quiet; then
            echo "No changes to commit -- ZIP matches current repository state"
            exit 0
          fi

          echo "=== Staged diff ==="
          git diff --cached --stat

          git commit -m "$COMMIT_MESSAGE"
          git push origin "HEAD:${GITHUB_REF_NAME}"
