name: source-qa

on:
  push:
  pull_request:

jobs:
  static-and-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python syntax
        run: |
          find data -type f -name '*.py' ! -path '*/vendor/*' -print0 | xargs -0 -n1 python -m py_compile
      - name: Shell syntax
        # `find | while` exits with the status of the LAST iteration, so a broken
        # file checked before the end used to pass unnoticed. Every file is now
        # reported and the step fails if any of them does not parse.
        run: |
          rc=0
          while IFS= read -r -d '' f; do
            sh -n "$f" || { echo "SHELL SYNTAX FAIL: $f"; rc=1; }
          done < <(find . -type f \( -name '*.sh' -o -name '*.sh.in' \) -not -path './.git/*' -print0)
          exit $rc
      - name: JSON syntax
        run: |
          find data -type f -name '*.json' -print0 | while IFS= read -r -d '' f; do python -m json.tool "$f" >/dev/null; done
      - name: Source-tree checksums
        run: sha256sum -c data/SHA256SUMS
      - name: Safety selftest
        env:
          NOKIA_LANG: en
        run: python data/master.py selftest-safety
      - name: Capability selftest
        env:
          NOKIA_LANG: en
        run: python data/master.py selftest-capabilities
      - name: Stock Web parser/crypto selftest
        run: python data/stock_web.py --selftest
      - name: Runtime assets
        run: python data/verify_release_assets.py
      - name: MF transition selftest
        env:
          NOKIA_LANG: en
        run: python data/master.py selftest-mf-transition
