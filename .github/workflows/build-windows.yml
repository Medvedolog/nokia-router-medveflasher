name: Build Windows kit

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Run tests before packaging
        run: python -m unittest discover -s tests -v
      - name: Build standalone Windows x64 kit
        shell: powershell
        run: .\windows\build-windows.ps1 -PythonCommand "python" -Clean
      - name: Upload Windows kit
        uses: actions/upload-artifact@v7
        with:
          path: build-windows/nokia-xg040gmd-windows-x64.zip
          archive: false
          retention-days: 30
