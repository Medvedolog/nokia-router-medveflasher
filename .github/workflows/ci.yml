name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python tools
        run: python -m compileall -q tools
      - name: Unified CLI smoke test
        run: python tools/nokia_tools.py --help

  shell:
    name: BusyBox ash and ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install shell tools
        run: sudo apt-get update && sudo apt-get install -y busybox shellcheck
      - name: Reject CRLF in router scripts
        shell: bash
        run: |
          if grep -Il $'\r' router/*.sh; then
            echo 'CRLF found in router scripts'
            exit 1
          fi
      - name: BusyBox ash syntax
        run: busybox ash -n router/*.sh
      - name: ShellCheck
        run: shellcheck -s sh router/*.sh
      - name: Whitespace check
        run: git diff --check
